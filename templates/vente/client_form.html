{% extends "base.html" %}
{% block title %}Nouveau client{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Breadcrumb -->
    <nav class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'vente_list' %}">Ventes</a></li>
            <li class="breadcrumb-item active">Nouveau client</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-person-plus"></i> Ajouter un client
                </div>
                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Nom du client</label>
                            {{ form.nom }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact</label>
                            {{ form.contact }}
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'vente_list' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Annuler
                            </a>
                            <button class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Enregistrer
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
