{% extends 'base.html' %}
{% block title %}Supprimer Utilisateur{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
    <h4>Supprimer l'utilisateur : {{ object.username }}</h4>
    <p class="text-muted">Êtes-vous sûr de vouloir supprimer cet utilisateur ? Cette action est irréversible.</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'entreprise:utilisateur_list' %}" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn btn-danger">Supprimer</button>
    </form>
</div>
{% endblock %}
